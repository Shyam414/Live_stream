<!DOCTYPE html>
<html>
<head>
    <title>Live YOLO Detection</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        #container {
            position: relative;
            display: inline-block;
            margin-top: 20px;
        }

        #video {
            display: block;
            width: 640px;
            max-width: 90vw;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Live YOLO Detection</h1>

    <button onclick="startCamera()">Start Camera</button>
    <button onclick="stopCamera()">Stop Camera</button>

    <br>

    <div id="container">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>

    <h3 id="status">Camera stopped</h3>


    <script>
        const video = document.getElementById("video");
        const overlay = document.getElementById("overlay");
        const ctx = overlay.getContext("2d");

        const captureCanvas = document.createElement("canvas");
        const captureCtx = captureCanvas.getContext("2d");

        const status = document.getElementById("status");

        let stream = null;
        let running = false;
        let processing = false;


        async function startCamera() {

            if (running) return;

            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {

                status.innerText =
                    "Camera API unavailable. HTTPS is required.";

                return;
            }

            try {
                status.innerText = "Requesting camera...";

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment"
                    },
                    audio: false
                });

                video.srcObject = stream;

                await video.play();

                running = true;

                overlay.width = video.videoWidth;
                overlay.height = video.videoHeight;

                overlay.style.width = video.clientWidth + "px";
                overlay.style.height = video.clientHeight + "px";

                console.log("Camera started:", video.videoWidth, video.videoHeight);

                status.innerText = "Camera started. Connecting to YOLO...";

                detectionLoop();

            } catch (error) {

                console.error("Camera error:", error);

                status.innerText =
                    "Camera error: " +
                    error.name + " - " +
                    error.message;
            }
        }


        async function detectionLoop() {

            while (running) {

                if (processing || video.readyState < 2 || video.videoWidth === 0) {
                    await new Promise(resolve => setTimeout(resolve, 200));
                    continue;
                }

                processing = true;

                try {
                    // Use smaller frame for faster upload/inference
                    const width = 640;
                    const height = Math.round(
                        video.videoHeight * (width / video.videoWidth)
                    );

                    captureCanvas.width = width;
                    captureCanvas.height = height;

                    captureCtx.drawImage(
                        video,
                        0,
                        0,
                        width,
                        height
                    );

                    const blob = await new Promise(resolve =>
                        captureCanvas.toBlob(
                            resolve,
                            "image/jpeg",
                            0.8
                        )
                    );

                    if (!blob) {
                        throw new Error("Could not create image");
                    }

                    console.log("Sending frame to /detect...", blob.size);

                    status.innerText = "Sending frame to YOLO...";

                    const formData = new FormData();
                    formData.append("frame", blob, "frame.jpg");

                    const response = await fetch("/detect", {
                        method: "POST",
                        body: formData
                    });

                    console.log(
                        "Response:",
                        response.status
                    );

                    if (!response.ok) {
                        const text = await response.text();
                        throw new Error(
                            "Server error " +
                            response.status +
                            ": " +
                            text
                        );
                    }

                    const data = await response.json();

                    console.log("YOLO RESULT:", data);

                    drawBoxes(data);

                } catch (error) {

                    console.error("Detection error:", error);

                    status.innerText =
                        "Detection error: " + error.message;

                } finally {
                    processing = false;
                }

                // Important: don't overload the Render CPU
                await new Promise(resolve => setTimeout(resolve, 500));
            }
        }


        function drawBoxes(data) {

            if (!data.detections) {
                console.error("Invalid response:", data);
                return;
            }

            // Canvas coordinate system = detection image
            overlay.width = data.frame_width;
            overlay.height = data.frame_height;

            // Visually overlay the video
            overlay.style.width = video.clientWidth + "px";
            overlay.style.height = video.clientHeight + "px";

            ctx.clearRect(
                0,
                0,
                overlay.width,
                overlay.height
            );

            data.detections.forEach(det => {

                ctx.strokeStyle = "#00ff00";
                ctx.lineWidth = 4;

                ctx.strokeRect(
                    det.x1,
                    det.y1,
                    det.x2 - det.x1,
                    det.y2 - det.y1
                );

                const label =
                    `${det.label} ${(det.confidence * 100).toFixed(0)}%`;

                ctx.font = "20px Arial";

                const textWidth = ctx.measureText(label).width;
                const textY = Math.max(0, det.y1 - 30);

                ctx.fillStyle = "#00ff00";

                ctx.fillRect(
                    det.x1,
                    textY,
                    textWidth + 10,
                    30
                );

                ctx.fillStyle = "black";

                ctx.fillText(
                    label,
                    det.x1 + 5,
                    textY + 22
                );
            });

            status.innerText =
                `Detected: ${data.detections.length} object(s)`;
        }


        function stopCamera() {

            running = false;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;

            ctx.clearRect(
                0,
                0,
                overlay.width,
                overlay.height
            );

            status.innerText = "Camera stopped";
        }
    </script>

</body>
</html>
